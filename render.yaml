# Render blueprint — the backend API on Render's free plan.
# Database: Postgres on Neon (free, doesn't expire; Render's free Postgres is deleted after 30 days).
# Files: a Backblaze B2 bucket (Render's disk is wiped on every restart and deploy). Any S3-compatible bucket works.
# The frontend is deployed separately on Vercel (see vercel.json); set VITE_API_URL there
# to this service's URL, and add the Vercel URL to CORS_ORIGINS and FRONTEND_URL below.
# Step-by-step: README.md, "Deployment".
services:
  - type: web
    name: campussphere-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # --proxy-headers keeps https:// in redirects; client IPs for rate limiting come
    # from TRUSTED_PROXY_HOPS instead (see backend/app/core/rate_limit.py)
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    # /ping doesn't touch the database. Render calls it every few seconds; /health (SELECT 1) there would keep
    # Neon awake whenever this service is, using up Neon's free compute hours.
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: PAYMENT_MODE
        value: "off"   # "test" is refused in production; online fee payment shows "not configured"
      - key: TRUSTED_PROXY_HOPS
        value: "1"   # Render's proxy appends the real client IP to X-Forwarded-For
      # Free plan = 512 MB RAM. Measured locally with these settings: ~160 MB idle, ~330 MB at most with the
      # analytics model loaded and every page in use (it was ~430 MB with the crawl running at boot).
      - key: WARM_UTILIZATION_MODEL
        value: "false"   # pandas + scikit-learn load on the first analytics request instead of at boot
      - key: BACKGROUND_CRAWLS
        value: "false"   # admins refresh Mitra's knowledge base / college documents from the app instead
      - key: MALLOC_ARENA_MAX
        value: "2"       # glibc: stop each thread keeping its own memory pool (big saving for threaded Python)
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Neon: the connection string (postgresql://...?sslmode=require) from the Neon dashboard
      - key: ADMIN_PASSWORD
        sync: false   # set in the Render dashboard before the first deploy
      - key: GROQ_API_KEY
        sync: false   # set in the Render dashboard
      - key: SARVAM_API_KEY
        sync: false   # optional: Mitra's Telugu / Hindi voice (sarvam.ai)
      - key: EMAIL_PROVIDER
        value: "off"   # "brevo" or "resend" once EMAIL_API_KEY and EMAIL_FROM are set: password-reset codes by email
      - key: EMAIL_API_KEY
        sync: false   # the Brevo or Resend API key
      - key: EMAIL_FROM
        sync: false   # a sender address verified with that service
      - key: CORS_ORIGINS
        sync: false   # e.g. https://campussphere.vercel.app (comma-separated, no trailing slash)
      - key: FRONTEND_URL
        sync: false   # the Vercel URL: certificate QR codes link to {FRONTEND_URL}/verify/<code>
      # Files (uploads, issued PDFs, evidence, room media, college documents) in Backblaze B2 — see
      # backend/app/core/storage.py. Same five values as in your .env.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false   # https://s3.<region>.backblazeb2.com (the bucket's "Endpoint", with https://)
      - key: S3_REGION
        sync: false   # the <region> part of the endpoint, e.g. us-east-005 (R2 would use "auto")
      - key: S3_BUCKET
        sync: false   # the bucket name (private)
      - key: S3_ACCESS_KEY_ID
        sync: false   # the B2 application key's keyID (Read and Write, this bucket only)
      - key: S3_SECRET_ACCESS_KEY
        sync: false   # ... and its applicationKey
