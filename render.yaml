# Render blueprint — backend API + Postgres.
# The frontend is deployed separately on Vercel (see vercel.json); set VITE_API_URL there
# to this service's URL, and add the Vercel URL to CORS_ORIGINS below.
services:
  - type: web
    name: campussphere-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campussphere-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false   # set in the Render dashboard before the first deploy
      - key: GROQ_API_KEY
        sync: false   # set in the Render dashboard
      - key: CORS_ORIGINS
        sync: false   # e.g. https://campussphere.vercel.app (comma-separated, no trailing slash)

databases:
  - name: campussphere-db
    databaseName: campussphere
    user: campussphere_user
    plan: free
