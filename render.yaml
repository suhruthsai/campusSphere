services:
  - type: web
    name: campussphere-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campussphere-db
          property: connectionString

databases:
  - name: campussphere-db
    databaseName: campussphere
    user: campussphere_user
    plan: free
